name: Verify isolated YDB migration branch

on:
  push:
    branches:
      - feature/ydb-unified-cutover
    paths:
      - services/ydb-next/**
      - .github/workflows/verify-ydb-parallel.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # No production environments, deployments, or Timeweb/YDB credentials.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
        working-directory: services/ydb-next
      - name: Verify syntax
        run: npm run check:syntax
        working-directory: services/ydb-next
      - name: Unit chat-operations
        continue-on-error: true
        run: node --test test/chat-operations.test.mjs
        working-directory: services/ydb-next
      - name: Unit chat-store
        continue-on-error: true
        run: node --test test/chat-store.test.mjs
        working-directory: services/ydb-next
      - name: Unit educator-report-dashboard
        continue-on-error: true
        run: node --test test/educator-report-dashboard.test.mjs
        working-directory: services/ydb-next
      - name: Unit legacy-bridge
        continue-on-error: true
        run: node --test test/legacy-bridge.test.mjs
        working-directory: services/ydb-next
      - name: Unit migration-audit
        continue-on-error: true
        run: node --test test/migration-audit.test.mjs
        working-directory: services/ydb-next
      - name: Unit name-variants-store
        continue-on-error: true
        run: node --test test/name-variants-store.test.mjs
        working-directory: services/ydb-next
      - name: Unit parent-access
        continue-on-error: true
        run: node --test test/parent-access.test.mjs
        working-directory: services/ydb-next
      - name: Unit parent-deletion
        continue-on-error: true
        run: node --test test/parent-deletion.test.mjs
        working-directory: services/ydb-next
      - name: Unit parent-registration
        continue-on-error: true
        run: node --test test/parent-registration.test.mjs
        working-directory: services/ydb-next
      - name: Unit report-engine
        continue-on-error: true
        run: node --test test/report-engine.test.mjs
        working-directory: services/ydb-next
      - name: Unit report-publications
        continue-on-error: true
        run: node --test test/report-publications.test.mjs
        working-directory: services/ydb-next
      - name: Unit report-reader
        continue-on-error: true
        run: node --test test/report-reader.test.mjs
        working-directory: services/ydb-next
      - name: Unit session-auth
        continue-on-error: true
        run: node --test test/session-auth.test.mjs
        working-directory: services/ydb-next
      - name: Unit stand-server
        continue-on-error: true
        run: node --test test/stand-server.test.mjs
        working-directory: services/ydb-next
      - name: Run complete isolated YDB unit test suite
        run: npm test
        working-directory: services/ydb-next
