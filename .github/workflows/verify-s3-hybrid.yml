name: Verify isolated S3 hybrid feature

on:
  push:
    branches:
      - feature/timeweb-s3-hybrid
  workflow_dispatch:

permissions:
  contents: read

jobs:
  stand_smoke:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm ci
      - run: node --check server.js && node --check services/s3-hybrid/object-store.cjs && node --check services/s3-hybrid/chat-store.cjs && node --check services/s3-hybrid/report-store.cjs
      - run: node --test tests/s3-hybrid-stand.test.cjs tests/s3-hybrid-storage.test.cjs

  legacy_regression:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
