name: Verify isolated YDB migration branch

on:
  push:
    branches:
      - feature/ydb-unified-cutover
    paths:
      - services/ydb-next/**
      - .github/workflows/verify-ydb-parallel.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    # No production environments, deployments, or Timeweb/YDB credentials.
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm install --ignore-scripts --no-audit --no-fund
        working-directory: services/ydb-next
      - name: Verify syntax
        run: npm run check:syntax
        working-directory: services/ydb-next
      - name: Run complete isolated YDB unit test suite
        run: npm test
        working-directory: services/ydb-next
