name: Verify Timeweb PostgreSQL NEXT (isolated)

on:
  push:
    branches:
      - feature/timeweb-postgres-cutover
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres_next:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: medsi_ci
          POSTGRES_PASSWORD: synthetic_ci_only
          POSTGRES_DB: medsi_ci
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U medsi_ci -d medsi_ci"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      CI: 'true'
      NODE_ENV: test
      MEDSI_NEXT_STAND: '1'
      MEDSI_NEXT_PG_ENABLED: '1'
      PG_TEST_INSECURE_LOCAL: '1'
      PGHOST: 127.0.0.1
      PGPORT: '5432'
      PGDATABASE: medsi_ci
      PGUSER: medsi_ci
      PGPASSWORD: synthetic_ci_only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install only Timeweb root runtime dependencies
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Verify production bootstrap without PostgreSQL SDK
        run: |
          npm run build
          node --input-type=module -e "await import('./services/postgres-next/app/stand-server.mjs'); await import('./services/postgres-next/src/connection.mjs'); console.log('POSTGRES_ROOT_ONLY_IMPORT_OK')"
      - name: Audit retired Cloudflare and Google upstreams
        run: node scripts/verify-next-isolation.mjs
      - name: Validate PostgreSQL runtime syntax
        run: |
          node --check services/postgres-next/src/connection.mjs
          node --check services/postgres-next/src/schema-cli.mjs
          node --check server.js
          node --check tutors/next-settings.js
      - name: PostgreSQL adapter and real disposable database
        run: node --test services/postgres-next/test/adapter.test.mjs services/postgres-next/test/integration.test.mjs
      - name: Verify purchased-database probe contract against disposable database
        run: node services/postgres-next/src/probe-cli.mjs
      - name: Rehearse backup and restore with synthetic PostgreSQL 18 data
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          set -euo pipefail
          docker exec "$PG_CONTAINER" createdb -U medsi_ci medsi_restore
          docker exec "$PG_CONTAINER" pg_dump -U medsi_ci -Fc medsi_ci |
            docker exec -i "$PG_CONTAINER" pg_restore -U medsi_ci --exit-on-error -d medsi_restore
          PGDATABASE=medsi_restore node services/postgres-next/src/probe-cli.mjs
          node services/postgres-next/test/verify-restored-backup.mjs
      - name: Rehearse D1 chat baseline import on PostgreSQL 18
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$PG_CONTAINER" createdb -U medsi_ci medsi_chat_import
          PGDATABASE=medsi_chat_import node --test services/postgres-next/test/d1-chat-import.test.mjs
      - name: Rehearse complete atomic import on PostgreSQL 18
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          docker exec "$PG_CONTAINER" createdb -U medsi_ci medsi_full_import
          PGDATABASE=medsi_full_import node --test services/postgres-next/test/full-import.test.mjs
      - name: Existing NEXT report logic and app regressions
        run: |
          npm test --prefix services/postgres-next
          npm run verify

  safeguard:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - name: Ensure production and personal data are not deployed
        run: |
          test -f services/postgres-next/sql/001_initial.sql
          test -f tutors/next-settings.js
          test -f apps-script/medsi-bot/report-parser.js
          test -f apps-script/medsi-bot/report-distribution.js
          ! grep -R "timeweb-next" services/postgres-next/src
